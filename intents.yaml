version: '1.0'
taxonomy_name: Spotify Support Intent Taxonomy
total_intents: 8
fallback_intent: other_or_ambiguous
tie_break_rules:
- 1. Security / Account Takeover (account_access)
- 2. Direct Financial / Billing Disputes (billing_and_payments)
- 3. Reproducible Functional / Technical Failures (technical_support)
- 4. Subscription Tier / Family Management (subscription_and_plans)
- 5. Specific Content Availability (content_availability)
- 6. Platform & Regional Compatibility (platform_and_regional)
- 7. Product Feedback & Complaints (product_feedback)
- 8. Ambiguous / Banter (other_or_ambiguous)
routing_policy:
  auto_handle: Safe to reply automatically without human agent review when issue is
    resolvable via public knowledge, standard troubleshooting, policy explanation,
    or self-service URLs.
  must_escalate: Requires human specialist review for account credential actions,
    security compromises, financial/billing dispute processing, or unresolved backend
    database ambiguity.
intents:
  content_availability:
    name: Content Availability & Licensing
    definition: Questions regarding missing, removed, greyed out, or upcoming songs,
      albums, artists, or podcasts, including regional catalog licensing differences.
    exclusions:
    - Playback failure where the track exists and is listed but produces an error
      when clicking play (technical_support).
    - General availability of Spotify service across an entire country (platform_and_regional).
    examples:
    - example_id: SpotifyCares:857985:857985:857984
      message: why AM to PM by Christina Milian is not available on US Spotify?!?
    - example_id: SpotifyCares:2932352:2932352:2932351
      message: missing some songs by Children of Bodom. Not available for Spain users?
  technical_support:
    name: Technical Support & App Performance
    definition: Issues involving software bugs, playback failures, crashes, audio
      glitches, sync problems, offline download failures, or UI rendering defects.
    exclusions:
    - Playback stopping because another device on the same Family account started
      playing (subscription_and_plans).
    - Third-party voice assistant / smart speaker integration issues (platform_and_regional).
    examples:
    - example_id: SpotifyCares:2032680:2032680:2032679
      message: 'Sort out your Chrome web app @Spotify I''m trying to get through my
        working day here #glitchy'
    - example_id: SpotifyCares:1837746:1837746:1837745
      message: tracks ive downloaded do not respond when I hit play. The GUI presses
        but no sound. Old stuff ok
  account_access:
    name: Account Access & Security
    definition: Problems logging in, password resets, account takeover/compromise,
      or lockout following third-party SSO (e.g., Facebook) deletion.
    exclusions:
    - Voluntarily requesting to permanently delete or close an account (subscription_and_plans).
    - Updating billing address or account profile information (subscription_and_plans).
    examples:
    - example_id: SpotifyCares:2707737:2707737:2707736
      message: deleted my Facebook account and now cannot access my spotify account.
        Help.
    - example_id: SpotifyCares:689544:689544:689543
      message: hi my premium account has been hacked. How may I proceed from here?
        Thanks.
  billing_and_payments:
    name: Billing, Payments & Invoicing
    definition: Disputes or questions regarding subscription charges, payment methods,
      billing dates, missing premium status, grace periods, or cancellation billing
      timing.
    exclusions:
    - Changing subscription plan tiers (e.g., upgrading to Family) (subscription_and_plans).
    - General complaints about premium pricing or ad frequency (product_feedback).
    examples:
    - example_id: SpotifyCares:262277:262277:262276
      message: what's up with me having to update my payment info every month? It's
        getting annoying.
    - example_id: SpotifyCares:2279791:2279791:2279790
      message: went to try out the student discount for Hulu but they charged me even
        thought I didn’t sign up for it
  subscription_and_plans:
    name: Subscription & Plan Management
    definition: Inquiries regarding Spotify plan types (Family, Student, Duo, Individual),
      Family member invitations, address verification, multi-stream rules, or account
      closure.
    exclusions:
    - General login failures or forgotten passwords (account_access).
    - Direct disputes over unauthorized bank charges (billing_and_payments).
    examples:
    - example_id: SpotifyCares:2653105:2653105:2653104
      message: I had a familiar account and know is not working. I tried to got it
        back but I couldn’t
    - example_id: SpotifyCares:576195:576195:576194
      message: i wanna delete my account, nobody wants that connected to facebook.
        give us an option to delete it
  platform_and_regional:
    name: Platform Compatibility & Regional Availability
    definition: Service availability in specific countries/regions, international
      roaming limits, or integration with external hardware/operating systems.
    exclusions:
    - Availability of a specific song or artist in an active country (content_availability).
    - General app crashes on standard mobile/desktop apps (technical_support).
    examples:
    - example_id: SpotifyCares:633732:633732:633730
      message: Seems like you can'start Spotify music/playlists with new Sonos voice
        control. What gives?
    - example_id: SpotifyCares:932757:932757:932756
      message: are you going to launch your services in INDIA?
  product_feedback:
    name: Product Feedback, Suggestions & UX Complaints
    definition: Feature suggestions, UI/UX feedback, comments on recommendation algorithms,
      ad frequency/placement complaints, or general user experience discontent.
    exclusions:
    - Reproducible software bugs, crashes, or playback glitches (technical_support).
    - Missing song licensing requests (content_availability).
    examples:
    - example_id: SpotifyCares:1975342:1975342:1975341
      message: why is my discover weekly playlist full of memes? @Spotify
    - example_id: SpotifyCares:1102158:1102158:1102157
      message: will you please make a 'most played' filter option? PLEASEEEE.
  other_or_ambiguous:
    name: Other, Social Banter & Ambiguous
    definition: Messages lacking an actionable support request, including compliments/praise,
      casual banter, jokes, vague or uninterpretable complaints requiring external
      media, fandom commentary, or spam.
    exclusions:
    - Messages with clear text describing an issue even if a link/image is attached
      (classify by the text).
    examples:
    - example_id: SpotifyCares:1477056:1477056:1477055
      message: Thanks. Try harder plz😉 https://t.co/Kf9KSF50hJ
    - example_id: SpotifyCares:344187:344187:344186
      message: you guys are gods. New Galneryus and you added Maximum the Hormone.
        A thousand thank yous
